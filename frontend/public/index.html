<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario - Chat Tesis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <title>Perfil</title>
</head>
<body class="bg-light min-vh-100">
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Perfil de Usuario</h5>
                    </div>
                    <div class="card-body">
                        <div id="userInfo">
                            <p>Cargando perfil...</p>
                        </div>
                        
                        <div id="followActions" class="mt-3">
                            <!-- Botones se cargarán dinámicamente -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script type="module">
        // Configuración
        const API_BASE = 'http://localhost:5000'; // URL del backend .NET
        const token = localStorage.getItem('auth_token') || '';
        
        // Elementos del DOM
        const userInfoDiv = document.getElementById('userInfo');
        const followActionsDiv = document.getElementById('followActions');
        const btnSeguir = document.getElementById('btnSeguir') || null;
        const btnDejarSeguir = document.getElementById('btnDejarSeguir') || null;
        const btnEnviarMsg = document.getElementById('btnEnviarMsg') || null;
        
        // Cargar perfil y estado de seguimiento
        async function cargarPerfil(userId) {
            try {
                // Obtener información del perfil
                const profileRes = await fetch(`${API_BASE}/chat/perfil/${userId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                const profileData = await profileRes.json();
                
                // Mostrar información del usuario
                userInfoDiv.innerHTML = `
                    <h5>Usuario ${profileData.ProfileUserId}</h5>
                    <p>ID: ${profileData.ProfileUserId}</p>
                    <p>Usuario actual: ${profileData.CurrentUserId}</p>
                `;
                
                // Cargar estado de seguimiento y botones
                actualizarEstado(profileData.YaSigue);
                
            } catch (error) {
                console.error('Error al cargar perfil:', error);
                userInfoDiv.innerHTML = '<p class="text-danger">Error al cargar perfil</p>';
            }
        }
        
        // Actualizar estado de botones
        function actualizarEstado(sigue) {
            // Limpiar botones anteriores
            followActionsDiv.innerHTML = '';
            
            if (sigue) {
                // Ya siguen - mostrar "Dejar de seguir" y "Enviar mensaje"
                followActionsDiv.innerHTML = `
                    <p class="text-success">✅ Ya sigues a este usuario</p>
                    <button id="btnDejarSeguir" class="btn btn-danger btn-block">
                        <i class="fas fa-user-minus"></i> Dejar de seguir
                    </button>
                    <a href="/chat/enviar-mensaje/${/* profileUserId */''}" class="btn btn-outline-primary btn-w-100">
                        <i class="fas fa-paper-plane"></i> Enviar mensaje
                    </a>
                `;
            } else {
                // No siguen - mostrar "Seguir"
                followActionsDiv.innerHTML = `
                    <button id="btnSeguir" class="btn btn-success btn-block">
                        <i class="fas fa-user-plus"></i> Seguir
                    </button>
                    <button id="btnEnviarMsg" class="btn btn-outline-primary btn-block" disabled>
                        <i class="fas fa-paper-plane"></i> Enviar mensaje
                    </button>
                `;
                
                // Agregar event listeners después de crear los elementos
                setupEventListeners();
            }
        }
        
        // Event listeners para botones
        function setupEventListeners() {
            // Botón Seguir
            const btnSeguir = document.getElementById('btnSeguir');
            if (btnSeguir) {
                btnSeguir.addEventListener('click', async () => {
                    if (!confirm('¿Estás seguro de seguir a este usuario?')) return;
                    
                    try {
                        const res = await fetch(`${API_BASE}/chat/seguir`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ targetId: /* profileUserId */ '' })
                        });
                        const data = await res.json();
                        
                        if (data.success) {
                            actualizarEstado(true);
                        }
                    } catch (error) {
                        console.error('Error al seguir:', error);
                    }
                });
            }
            
            // Botón Dejar de seguir (con confirmación)
            const btnDejarSeguir = document.getElementById('btnDejarSeguir');
            if (btnDejarSeguir) {
                btnDejarSeguir.addEventListener('click', async () => {
                    if (!confirm('¿Estás seguro de dejar de seguir a este usuario?\nEsto removerá la relación de seguimiento.')) return;
                    
                    try {
                        const res = await fetch(`${API_BASE}/chat/dejar-seguir`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ targetId: '' })
                        });
                        const data = await res.json();
                        
                        if (data.success) {
                            actualizarEstado(false);
                        }
                    } catch (error) {
                        console.error('Error al dejar de seguir:', error);
                    }
                });
            }
            
            // Botón Enviar mensaje
            const btnEnviarMsg = document.getElementById('btnEnviarMsg');
            if (btnEnviarMsg) {
                btnEnviarMsg.addEventListener('click', () => {
                    window.location.href = '/chat/enviar-mensaje/';
                });
            }
        }
        
        // Inicializar al cargar
        document.addEventListener('DOMContentLoaded', () => {
            // Obtener userId de la URL o de algún elemento de la página
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('id') || '5'; // ID por defecto
            cargarPerfil(userId);
        });
    </script>
</body>
</html>
